<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>StintPro — Acceso</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #07090F;
      color: #C8D0DB;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      /* Halo ámbar muy tenue detrás de la tarjeta */
      background:
        radial-gradient(ellipse 60% 45% at 50% 42%, rgba(245,166,35,.07), transparent 70%),
        #07090F;
    }

    .wrap {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #F5A623;
      letter-spacing: 0.16em;
    }

    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #4E5E72;
      letter-spacing: 0.14em;
      margin-top: 8px;
      margin-bottom: 28px;
    }

    .card {
      width: 100%;
      background: #0D1018;
      border: 1px solid #1A2030;
      border-radius: 6px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    .card[hidden] { display: none; }

    .card-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #F5A623;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .fields { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      color: #4E5E72;
      letter-spacing: 0.06em;
    }

    input {
      background: #07090F;
      border: 1px solid #1A2030;
      border-radius: 3px;
      padding: 10px 12px;
      font-size: 14px;
      color: #EDF0F4;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #F5A623; }
    input::placeholder { color: #2A3848; }

    .err {
      font-size: 12px;
      color: #c04444;
      min-height: 16px;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      font-size: 13px;
      font-weight: 500;
      color: #07090F;
      background: #F5A623;
      border: none;
      padding: 11px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s;
    }

    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.6; cursor: default; }

    .note {
      font-size: 12px;
      color: #3E4E62;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="logo">STINTPRO</div>
  <div class="tagline">KARTING STRATEGY</div>

  <!-- Login -->
  <form id="card-login" class="card" onsubmit="handleLogin(); return false;">
    <div class="card-title">INICIAR SESIÓN</div>
    <div class="fields">
      <div class="field">
        <label for="login-email">CORREO ELECTRÓNICO</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="tu@equipo.com"/>
      </div>
      <div class="field">
        <label for="login-pw">CONTRASEÑA</label>
        <input id="login-pw" type="password" autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <div id="login-err" class="err" role="alert"></div>
      <button id="login-btn" type="submit" class="btn-submit">Entrar</button>
    </div>
  </form>

  <p class="note"><a href="#" id="reset-link" onclick="handleReset(); return false;" style="color:#8A9AAE">¿Has olvidado la contraseña?</a></p>
  <p class="note">Acceso solo por invitación</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-auth.js"></script>
<script>
  var NO_ACCESS_MSG = 'Tu cuenta no tiene acceso a StintPro. Pide una invitación al administrador.';
  if (new URLSearchParams(location.search).has('sin-acceso')) {
    document.getElementById('login-err').textContent = NO_ACCESS_MSG;
  }

  async function handleLogin() {
    var email = (document.getElementById('login-email').value || '').trim();
    var pw    = document.getElementById('login-pw').value || '';
    var errEl = document.getElementById('login-err');
    var btn   = document.getElementById('login-btn');
    if (!email || !pw) { errEl.textContent = 'Introduce email y contraseña'; return; }
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Accediendo…';
    try {
      await SPAuth.signIn(email, pw);
      // Cuenta sin claim member (p.ej. dada de alta por la API pública de Firebase): fuera.
      if (!(await SPAuth.isMember())) {
        await SPAuth.signOut();
        errEl.textContent = NO_ACCESS_MSG;
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      window.location.href = (await SPAuth.isAdmin()) ? '/hub.html' : '/index.html';
    } catch (e) {
      errEl.textContent = SPAuth.errorMessage(e);
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }

  async function handleReset() {
    var email = (document.getElementById('login-email').value || '').trim();
    var errEl = document.getElementById('login-err');
    if (!email) { errEl.textContent = 'Escribe tu email y vuelve a pulsar «¿Has olvidado la contraseña?»'; return; }
    try {
      await SPAuth.sendReset(email);
      errEl.textContent = 'Si la cuenta existe, te hemos enviado un correo para poner una contraseña nueva.';
    } catch (e) {
      errEl.textContent = SPAuth.errorMessage(e);
    }
  }

  // Con sesión ya abierta (y de un miembro), no se queda en el login.
  SPAuth.ready().then(async function (u) {
    if (!u || !(await SPAuth.isMember())) return;
    window.location.replace((await SPAuth.isAdmin()) ? '/hub.html' : '/index.html');
  }).catch(function (e) { console.warn('[StintPro] comprobación de sesión fallida:', e); });
</script>

</body>
</html>
