<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>StintPro — Acceso</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #07090F;
      color: #C8D0DB;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      /* Halo ámbar muy tenue detrás de la tarjeta */
      background:
        radial-gradient(ellipse 60% 45% at 50% 42%, rgba(245,166,35,.07), transparent 70%),
        #07090F;
    }

    .wrap {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #F5A623;
      letter-spacing: 0.16em;
    }

    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #4E5E72;
      letter-spacing: 0.14em;
      margin-top: 8px;
      margin-bottom: 28px;
    }

    .card {
      width: 100%;
      background: #0D1018;
      border: 1px solid #1A2030;
      border-radius: 6px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    .card[hidden] { display: none; }

    .card-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #F5A623;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .fields { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      color: #4E5E72;
      letter-spacing: 0.06em;
    }

    input {
      background: #07090F;
      border: 1px solid #1A2030;
      border-radius: 3px;
      padding: 10px 12px;
      font-size: 14px;
      color: #EDF0F4;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #F5A623; }
    input::placeholder { color: #2A3848; }

    .err {
      font-size: 12px;
      color: #c04444;
      min-height: 16px;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      font-size: 13px;
      font-weight: 500;
      color: #07090F;
      background: #F5A623;
      border: none;
      padding: 11px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s;
    }

    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.6; cursor: default; }

    .note {
      font-size: 12px;
      color: #3E4E62;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="logo">STINTPRO</div>
  <div class="tagline">KARTING STRATEGY</div>

  <!-- Login -->
  <form id="card-login" class="card" onsubmit="handleLogin(); return false;">
    <div class="card-title">INICIAR SESIÓN</div>
    <div class="fields">
      <div class="field">
        <label for="login-email">CORREO ELECTRÓNICO</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="tu@equipo.com"/>
      </div>
      <div class="field">
        <label for="login-pw">CONTRASEÑA</label>
        <input id="login-pw" type="password" autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <div id="login-err" class="err" role="alert"></div>
      <button id="login-btn" type="submit" class="btn-submit">Entrar</button>
    </div>
  </form>

  <!-- Activar cuenta (flujo de invitación) -->
  <form id="card-invite" class="card" hidden onsubmit="handleActivate(); return false;">
    <div class="card-title">ACTIVAR CUENTA</div>
    <div class="fields">
      <div class="field">
        <label for="invite-name">NOMBRE</label>
        <input id="invite-name" type="text" autocomplete="name" placeholder="Tu nombre"/>
      </div>
      <div class="field">
        <label for="invite-pw">CONTRASEÑA</label>
        <input id="invite-pw" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"/>
      </div>
      <div class="field">
        <label for="invite-pw2">CONFIRMAR CONTRASEÑA</label>
        <input id="invite-pw2" type="password" autocomplete="new-password" placeholder="Repite la contraseña"/>
      </div>
      <div id="invite-err" class="err" role="alert"></div>
      <button id="invite-btn" type="submit" class="btn-submit">Activar mi cuenta</button>
    </div>
  </form>

  <p class="note">Acceso solo por invitación</p>
</main>

<script>
  var SUPA_URL = 'https://nyybrybnvflwbdwdqpwa.supabase.co';
  var SUPA_KEY = 'sb_publishable_sXd5RxPkUkDlopEW4Rah9g_WpocEK5H';

  async function handleLogin() {
    var email = (document.getElementById('login-email').value || '').trim();
    var pw    = document.getElementById('login-pw').value || '';
    var errEl = document.getElementById('login-err');
    var btn   = document.getElementById('login-btn');
    if (!email || !pw) { errEl.textContent = 'Introduce email y contraseña'; return; }
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Accediendo…';

    try {
      var res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPA_KEY
        },
        body: JSON.stringify({ email: email, password: pw })
      });
      var data = await res.json();
      if (!res.ok || data.error) {
        errEl.textContent = 'Email o contraseña incorrectos';
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      localStorage.setItem('sb-nyybrybnvflwbdwdqpwa-auth-token', JSON.stringify({
        access_token:  data.access_token,
        refresh_token: data.refresh_token,
        expires_in:    data.expires_in,
        expires_at:    Math.floor(Date.now() / 1000) + data.expires_in,
        token_type:    'bearer',
        user:          data.user
      }));
      var profileRes = await fetch(SUPA_URL + '/rest/v1/profiles?select=role&id=eq.' + data.user.id, {
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': 'Bearer ' + data.access_token
        }
      });
      var profile = await profileRes.json();
      var role = (profile[0] && profile[0].role) || 'user';
      window.location.href = role === 'admin' ? '/hub.html' : '/index.html';
    } catch(e) {
      errEl.textContent = 'Error de red. Comprueba la conexión.';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }

  var _inviteToken = null;

  (function detectInvite() {
    var hash = window.location.hash.slice(1);
    if (!hash) return;
    var params = {};
    hash.split('&').forEach(function(p) { var kv = p.split('='); params[kv[0]] = decodeURIComponent(kv[1] || ''); });
    if (params.type !== 'invite' || !params.access_token) return;

    _inviteToken = { access_token: params.access_token, refresh_token: params.refresh_token };
    history.replaceState(null, '', window.location.pathname);

    var jwtPayload = JSON.parse(atob(params.access_token.split('.')[1]));
    fetch(SUPA_URL + '/rest/v1/profiles?select=name&id=eq.' + jwtPayload.sub, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + params.access_token }
    }).then(function(r) { return r.json(); }).then(function(rows) {
      var name = rows && rows[0] && rows[0].name;
      if (name) document.getElementById('invite-name').value = name;
    }).catch(function() {});

    document.getElementById('card-login').hidden = true;
    document.getElementById('card-invite').hidden = false;
  })();

  async function handleActivate() {
    var name  = (document.getElementById('invite-name').value || '').trim();
    var pw    = document.getElementById('invite-pw').value || '';
    var pw2   = document.getElementById('invite-pw2').value || '';
    var errEl = document.getElementById('invite-err');
    var btn   = document.getElementById('invite-btn');

    if (!name)        { errEl.textContent = 'Introduce tu nombre'; return; }
    if (pw.length < 8){ errEl.textContent = 'La contraseña debe tener al menos 8 caracteres'; return; }
    if (pw !== pw2)   { errEl.textContent = 'Las contraseñas no coinciden'; return; }
    if (!_inviteToken){ errEl.textContent = 'Enlace de invitación inválido'; return; }

    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Activando…';

    try {
      var res = await fetch(SUPA_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + _inviteToken.access_token },
        body: JSON.stringify({ password: pw, data: { name: name } })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Error al activar');

      await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + data.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + _inviteToken.access_token, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ name: name })
      });

      localStorage.setItem('sb-nyybrybnvflwbdwdqpwa-auth-token', JSON.stringify({
        access_token:  _inviteToken.access_token,
        refresh_token: _inviteToken.refresh_token,
        expires_in:    3600,
        expires_at:    Math.floor(Date.now() / 1000) + 3600,
        token_type:    'bearer',
        user:          data
      }));

      var profileRes = await fetch(SUPA_URL + '/rest/v1/profiles?select=role&id=eq.' + data.id, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + _inviteToken.access_token }
      });
      var profile = await profileRes.json();
      var role = (profile[0] && profile[0].role) || 'user';
      window.location.href = role === 'admin' ? '/hub.html' : '/index.html';
    } catch(e) {
      errEl.textContent = e.message || 'Error al activar la cuenta';
      btn.disabled = false; btn.textContent = 'Activar mi cuenta';
    }
  }
</script>

</body>
</html>
